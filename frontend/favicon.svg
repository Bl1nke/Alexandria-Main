<!-- Иконка вкладки Alexandria повторяет логотип из шапки сайта:
     тёмный скруглённый квадрат с белой буквой «A» (светлая тема).
     Буква нарисована контуром, а не текстом: во вкладке внешние шрифты
     (Inter) не подгружаются, поэтому <text> выглядел бы иначе. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Alexandria">
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" fill="#111827" stroke="#dce1e8" stroke-width="1" />
  <path fill="#ffffff" fill-rule="evenodd" d="M10.3 21.8 L15 10.2 H17 L21.7 21.8 H19.22 L17.84 18.4 H14.16 L12.78 21.8 Z M16 13.85 L15.01 16.3 H16.99 Z" />
</svg>
